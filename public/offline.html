<!doctype html>
<html lang="id">
<head>

<title>Sedang Offline · Masjid Baitul Fadli</title>

<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f8faf9;color:#0f172a;font-size:18px;line-height:1.6;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}

</style>

<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>Anda sedang offline</h1>
    <p>Periksa koneksi internet Anda, lalu coba lagi. Halaman yang pernah dibuka mungkin tetap dapat dilihat.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>
